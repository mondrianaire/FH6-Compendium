name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Rebuild the browser bundle from data/*.json so the deploy is never stale (no deps needed)
      - name: Build db.js bundle
        run: node scripts/build-db.mjs
        env:
          BUILD_STAMP: ${{ github.sha }}
      - name: Disable Jekyll
        run: touch dashboard/.nojekyll
      - name: Upload dashboard/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
