// three-tile ladder: Stock / Sport / Race (§10.5 — the Street tier is absent, not renumbered)
function ladder(base, prices, effects, extra) {
  const tiers = ["Stock", "Sport", "Race"];
  return tiers.map((t, i) => Object.assign({
    pos: i + 1, pid: p(), level: i === 0 ? 0 : i + 1, name: t + " " + base,
    price: i === 0 ? 0 : prices[i - 1], stock: i === 0, mass_lb: null,
    effect: effects ? effects[i - 1] || null : null
  }, (extra && extra[i]) || {}));
}
function tiles(list) { return list.map((t, i) => Object.assign({ pos: i + 1, pid: p(), stock: i === 0,

/* ---- the fitted build (api/build/<hw>.json parts[] where pid != null) ------- */

  const all = [];
  OPTIONS.shop.forEach(a => a.menus.forEach(m => { if (m.slot === slot) all.push(...(m.tiles || [])); }));
  const t = all.find(t => t.name === name);
  return t ? t.pid : null;
}

  const f = {};
  (o.shop || []).forEach(a => (a.menus || []).forEach(mu => {
    const buy = (mu.tiles || []).filter(t => !t.stock && t.pid != null);
    if (buy.length) f[mu.slot] = buy[buy.length - 1].pid;
  }));
  const b = ((o.rims || {}).brands || [])[0];
  if (b && (b.rims || []).length) { f.rim_style = b.rims[0].pid; f.rear_rim_style = b.rims[0].pid; }
  return f;
}
async function tryReal() {
  // ?fixture forces the spec-built NSX-R (the toggles below only drive that one)
  if (/[?&]fixture/.test(location.search)) {
    document.getElementById("src").textContent = "fixture (spec-built, NSX-R 412) — forced";
    return false;
  }
  const want = (/[?&]ord=(\d+)/.exec(location.search) || [])[1];
  for (const ord of (want ? [want] : [3212, 412])) {
    try {
      const r = await fetch("../api/options/" + ord + ".json");
      if (r.ok) {
        const j = await r.json();
        model.options = j;
        model.fitted = fittedFromOptions(j);
        model.done = {};
        document.getElementById("src").textContent = "api/options/" + ord + ".json";
        return true;
      }
    } catch (e) {}
  }
  document.getElementById("src").textContent = "fixture (spec-built, NSX-R 412)";
  return false;
}
tryReal().then(() => GameSheet.render(host, model));

document.getElementById("tglLock").onclick = () => {
  model.locked = !model.locked; GameSheet.render(host, model);
};
document.getElementById("tglStats").onclick = () => {
  model.stats = model.stats ? null : STATS; GameSheet.render(host, model);
};
document.getElementById("tglKit").onclick = () => {
  model.fitted.car_body = model.fitted.car_body === pidOf("car_body", "Rocket Bunny - Widebody Kit")
    ? pidOf("car_body", "Honda - Stock Body")
    : pidOf("car_body", "Rocket Bunny - Widebody Kit");
  GameSheet.render(host, model);
};
document.getElementById("tglAsp").onclick = () => {
  model.fitted.centrifugal_supercharger = model.fitted.centrifugal_supercharger == null
    ? pidOf("centrifugal_supercharger", "Race Centrifugal Supercharger") : null;
  GameSheet.render(host, model);
};
document.getElementById("reset").onclick = () => { model.done = {}; GameSheet.render(host, model); };
</script>
