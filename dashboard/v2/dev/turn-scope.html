<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turn scope — overlay mockups</title>
<link rel="stylesheet" href="../styles.css?v=202">
<style>
  /* MOCKUP ONLY (Jett 2026-09-18: "is there a way to overlay speed, Gforce, grip status, pedal inputs and
     rating onto a single graph. Lets explore what these would look like in a separate mock up"). Four
     candidate compositions of the same five channels, all drawn from the REAL course export so the shapes
     are the shapes -- nothing here is invented. Nothing in this file is loaded by the dashboard. */
  body{margin:0;padding:0 0 60px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px}
  header.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
    height:auto;min-height:0;max-height:none;overflow:visible;
    padding:8px 18px;display:grid;grid-template-columns:auto 1fr;gap:3px 14px;align-items:baseline}
  header.top h1{font:700 15px var(--sans);margin:0;letter-spacing:0}
  header.top .sub{grid-column:2}
  header.top .ctl{grid-column:1/-1;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:3px}
  select{font:12px var(--mono)}
  .cand{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin:18px 0}
  .cand>h2{font:700 14px var(--sans);margin:0 0 2px;letter-spacing:0;text-transform:none;color:var(--ink)}
  .cand>h2 small{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-left:8px}
  .cap{font-size:12px;line-height:1.5;color:var(--mut);margin:0 0 12px;max-width:96ch}
  .cap b{color:var(--ink);font-weight:600}
  .cost{font-size:11px;color:var(--dim);margin-top:10px;border-top:1px solid var(--line);padding-top:7px}
  .cost b{color:var(--mut);font-weight:600}
  svg.scope{display:block;width:100%;height:auto;overflow:visible}
  .two{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
  .key{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px}
  .key span{display:inline-flex;align-items:center;gap:4px}
  .key i{width:11px;height:11px;border-radius:2px;display:inline-block}
  .key i.ln{height:3px;width:16px;border-radius:2px}
  .note{background:var(--panel2);border-left:3px solid var(--acc2);border-radius:0 6px 6px 0;padding:9px 12px;
    font-size:12px;line-height:1.5;color:var(--mut);margin:16px 0}
  .note b{color:var(--ink)}
  .miss{color:#e3b341}
  @media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header class="top">
  <h1>Turn scope</h1>
  <span class="why sub">four ways to put speed · g · grip · pedals · limit-use on one picture — real data, <span id="src"></span></span>
  <span class="ctl"><label class="why">turn <select id="turn"></select></label>
  <label class="why">highlight <select id="lap"></select></label>
  <label class="why">class <select id="cls"></select></label></span>
</header>
<div class="wrap">
  <div class="note" id="dataNote"></div>
  <section class="cand" id="cA"></section>
  <section class="cand" id="cB"></section>
  <section class="cand" id="cC"></section>
  <section class="cand" id="cD"></section>
</div>
<script>
// ---------------------------------------------------------------------------------------------------
// THE FIVE CHANNELS, and where each one actually comes from today
//   speed   lap_point.mph          exported          — measured
//   grip    lap_point.grip 0-4     exported          — measured (0 calm 1 front 2 rear 3 both 4 impact)
//   pedals  lap_point.thr / .brk   exported          — measured (schema 6)
//   g       DERIVED here           NOT exported      — lap_point.lat_g (schema 7) and r_m (schema 9) are in
//                                                      the database and would ship this honestly; until then
//                                                      a_lat = v^2 * curvature of the driven path and
//                                                      a_long = d(v^2)/2ds, both from the exported x/z/mph.
//   rating  |a| / aMax             aMax exported     — course.classGrip[class] speed-banded ceiling; the
//                                                      share of the car's available grip actually in use.
// The measured per-phase peak |lat g| (phaseObs row[8]) IS exported, and is drawn as a cross on candidate B
// so the derived curve can be checked against the real number rather than trusted.
const SEG_ORDER = ["braking", "turn_in", "mid", "exit", "straight"];
const SEG_COL = { braking: "#6c8cf0", turn_in: "#45c8b0", mid: "#f0b429", exit: "#63d19e", straight: "#8a95a5" };
const SEG_LABEL = { braking: "Braking", turn_in: "Entry", mid: "Mid-corner", exit: "Exit", straight: "Straight / crest" };
const DGRIP = {
  calm:   { col: "#2a313c", ink: "#8b97a7", word: "within grip" },
  front:  { col: "#2f81f7", ink: "#2f81f7", word: "understeer" },
  rear:   { col: "#e5414e", ink: "#e5414e", word: "oversteer" },
  both:   { col: "#a371f7", ink: "#a371f7", word: "drift / overdriven" },
  impact: { col: "#e3b341", ink: "#e3b341", word: "impact / jolt" },
};
const GSTATE = ["calm", "front", "rear", "both", "impact"];
const PED = { thr: "#3fb67c", brk: "#d9542f" };
const G = 9.80665, MPS = 0.44704;
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const med = (a) => { const v = a.filter((x) => x != null && isFinite(x)).sort((x, y) => x - y);
  return v.length ? (v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2) : null; };
const quant = (a, q) => { const v = a.filter((x) => x != null && isFinite(x)).sort((x, y) => x - y);
  return v.length ? v[Math.min(v.length - 1, Math.floor(q * v.length))] : null; };

let C = null, REF = null, TURN = null, LAPS = {}, PICK = null, CLS = "";

// nearest reference-lap arc for a world point -- the turns' phase polylines are in world space, the traces
// are parameterised by arc, and this is the one join between them.
function arcAt(x, z) {
  let bd = Infinity, ba = null;
  for (const p of REF) { const d = (p[3] - x) ** 2 + (p[4] - z) ** 2; if (d < bd) { bd = d; ba = p[0]; } }
  return ba;
}
// a turn's window on the arc axis, plus each phase's span inside it
function turnWindow(t) {
  const sp = [];
  for (const n of SEG_ORDER) {
    const poly = (t.seg || {})[n]; if (!poly || poly.length < 2) continue;
    const a = arcAt(poly[0][0], poly[0][1]), b = arcAt(poly[poly.length - 1][0], poly[poly.length - 1][1]);
    if (a == null || b == null) continue;
    sp.push({ n, a: Math.min(a, b), b: Math.max(a, b) });
  }
  if (!sp.length) return null;
  const a0 = Math.min(...sp.map((s) => s.a)), a1 = Math.max(...sp.map((s) => s.b));
  return { a0, a1, len: a1 - a0, phases: sp };
}
// per-point derivation. x/z are whole metres at ~12 m spacing, so the path is smoothed over 3 points before
// its curvature is taken; without that the rounding alone swings a_lat by more than a g.
function derive(pts) {
  const n = pts.length, sx = [], sz = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[i], c = pts[Math.min(n - 1, i + 1)];
    sx.push((a[3] + b[3] + c[3]) / 3); sz.push((a[4] + b[4] + c[4]) / 3);
  }
  const out = [];
  for (let i = 0; i < n; i++) {
    const v = (pts[i][1] || 0) * MPS;
    let aLong = null, aLat = null;
    if (i > 0 && i < n - 1) {
      const ds = pts[i + 1][0] - pts[i - 1][0];
      const v0 = (pts[i - 1][1] || 0) * MPS, v1 = (pts[i + 1][1] || 0) * MPS;
      if (ds > 0.5) aLong = (v1 * v1 - v0 * v0) / (2 * ds) / G;
      const x1 = sx[i - 1], y1 = sz[i - 1], x2 = sx[i], y2 = sz[i], x3 = sx[i + 1], y3 = sz[i + 1];
      const A = x2 - x1, B = y2 - y1, Cc = x3 - x1, D = y3 - y1;
      const E = A * (x1 + x2) + B * (y1 + y2), F = Cc * (x1 + x3) + D * (y1 + y3), Gg = 2 * (A * D - B * Cc);
      if (Math.abs(Gg) > 1e-6) {
        const cx = (D * E - B * F) / Gg, cy = (A * F - Cc * E) / Gg, R = Math.hypot(x2 - cx, y2 - cy);
        if (R > 3) aLat = -Math.sign(A * D - B * Cc) * (v * v / R) / G;   // -: world z is screen-up, so R must plot right
      }
    }
    if (aLat != null) aLat = Math.max(-3.5, Math.min(3.5, aLat));
    out.push({ arc: pts[i][0], mph: pts[i][1], grip: pts[i][2] | 0, thr: pts[i][6], brk: pts[i][7], aLat, aLong });
  }
  return out;
}
function aMaxFor(cls, mph) {
  const cg = (C.classGrip || {})[cls]; if (!cg) return null;
  const b = (cg.bands || []).find((x) => mph >= x.lo && (x.hi == null || mph < x.hi));
  return (b ? b.aMax : cg.aMax) || null;
}
// every pass through this turn, on a common "metres through the turn" axis, plus 4 m bins for the envelope
function collect(t) {
  const w = turnWindow(t); if (!w) return null;
  const passes = [];
  for (const [lid, tr] of Object.entries(C.traces || {})) {
    const L = LAPS[lid]; if (!L) continue;
    if (CLS && L.class !== CLS) continue;
    const seg = tr.filter((p) => p[0] >= w.a0 - 6 && p[0] <= w.a1 + 6);
    if (seg.length < 6) continue;
    passes.push({ id: lid, lap: L, pts: derive(seg).map((p) => ({ ...p, s: p.arc - w.a0 })) });
  }
  if (!passes.length) return null;
  // EVERY PASS ONTO THE SAME GRID. The traces are sampled every ~12 m, so binning at 4 m leaves two bins in
  // three empty and the medians spike to the floor. Each pass is INTERPOLATED along its own arc onto the bin
  // centres instead -- a pass contributes to a bin only where it actually has points either side of it, so a
  // bin's count is still the number of real passes covering that metre of road, never a fabricated one.
  const BIN = 4, nb = Math.max(1, Math.ceil(w.len / BIN)), bins = [];
  for (let i = 0; i < nb; i++) bins.push({ s: i * BIN + BIN / 2, mph: [], aLat: [], aLong: [], aTot: [], util: [], thr: [], brk: [], grip: [0, 0, 0, 0, 0] });
  const lerp = (pts, s, f) => {                       // linear in arc; null outside the pass's own coverage
    if (s < pts[0].s || s > pts[pts.length - 1].s) return null;
    let i = 0; while (i < pts.length - 2 && pts[i + 1].s < s) i++;
    const a = pts[i], b = pts[i + 1], va = f(a), vb = f(b);
    if (va == null || vb == null) return va == null ? vb : va;
    const d = b.s - a.s; return d <= 0 ? va : va + (vb - va) * ((s - a.s) / d);
  };
  const nearestGrip = (pts, s) => { let bd = Infinity, g = null;
    for (const q of pts) { const d = Math.abs(q.s - s); if (d < bd) { bd = d; g = q.grip; } }
    return bd <= 8 ? g : null; };
  for (const p of passes) for (const b of bins) {
    const mph = lerp(p.pts, b.s, (q) => q.mph); if (mph == null) continue;
    const aLat = lerp(p.pts, b.s, (q) => q.aLat), aLong = lerp(p.pts, b.s, (q) => q.aLong);
    const thr = lerp(p.pts, b.s, (q) => q.thr), brk = lerp(p.pts, b.s, (q) => q.brk);
    b.mph.push(mph);
    if (thr != null) b.thr.push(thr);
    if (brk != null) b.brk.push(brk);
    if (aLat != null) b.aLat.push(aLat);
    if (aLong != null) b.aLong.push(aLong);
    if (aLat != null && aLong != null) {
      const at = Math.hypot(aLat, aLong); b.aTot.push(at);
      const am = aMaxFor(p.lap.class, mph); if (am) b.util.push(at / am * 100);
    }
    const g = nearestGrip(p.pts, b.s); if (g != null) b.grip[g] = (b.grip[g] || 0) + 1;
  }
  for (const b of bins) {
    const tot = b.grip.reduce((a, c) => a + c, 0);
    b.mix = tot ? b.grip.map((c) => c / tot) : null;
    b.n = b.mph.length;
    b.ceil = med(passes.map((p) => aMaxFor(p.lap.class, med(b.mph) || 60)).filter(Boolean));
  }
  // the measured per-phase peak |lat g| that IS exported, so the derived curve has something to answer to
  const anchors = [];
  for (const sp of w.phases) {
    const rows = (t.phaseObs || {})[sp.n] || [];
    const vals = rows.filter((r) => (!CLS || (LAPS[r[0]] && LAPS[r[0]].class === CLS)) && r[8] != null).map((r) => r[8]);
    if (vals.length) anchors.push({ n: sp.n, s: (sp.a + sp.b) / 2 - w.a0, g: med(vals), n_obs: vals.length });
  }
  return { w, passes, bins, anchors, BIN };
}

// ---- tiny SVG helpers -------------------------------------------------------------------------------
const P = (pts) => pts.map(([x, y]) => x.toFixed(1) + "," + y.toFixed(1)).join(" ");
// a series with holes must break, never fall to the axis: one <polyline> per run of consecutive real values
function line(xs, ys, attrs) {
  let out = "", run = [];
  const flush = () => { if (run.length > 1) out += `<polyline points="${P(run)}" fill="none" ${attrs}/>`; run = []; };
  for (let i = 0; i < xs.length; i++) { if (ys[i] == null || !isFinite(ys[i])) flush(); else run.push([xs[i], ys[i]]); }
  flush(); return out;
}
function area(xs, ys, floor, fill, op) {
  let out = "", run = [];
  const flush = () => { if (run.length > 1) out += `<polygon points="${P(run.concat([[run[run.length - 1][0], floor], [run[0][0], floor]]))}" fill="${fill}" opacity="${op}"/>`; run = []; };
  for (let i = 0; i < xs.length; i++) { if (ys[i] == null || !isFinite(ys[i])) flush(); else run.push([xs[i], ys[i]]); }
  flush(); return out;
}
function band(xs, lo, hi, col, op) {
  let out = "", up = [], dn = [];
  const flush = () => { if (up.length > 1) out += `<polygon points="${P(up.concat(dn.reverse()))}" fill="${col}" opacity="${op}"/>`; up = []; dn = []; };
  for (let i = 0; i < xs.length; i++) {
    if (lo[i] == null || hi[i] == null || !isFinite(lo[i]) || !isFinite(hi[i])) flush();
    else { up.push([xs[i], hi[i]]); dn.push([xs[i], lo[i]]); }
  }
  flush(); return out;
}
const txt = (x, y, s, o) => `<text x="${x}" y="${y}" font-size="${(o && o.size) || 9}" fill="${(o && o.fill) || "var(--dim)"}"${o && o.anchor ? ` text-anchor="${o.anchor}"` : ""}${o && o.weight ? ` font-weight="${o.weight}"` : ""} font-family="var(--mono)">${esc(s)}</text>`;

// phase backdrop, shared by every candidate: the WHERE axis stays the same colour everywhere
function phaseBack(D, X, y0, y1, lab) {
  return D.w.phases.map((sp) => {
    const a = X(sp.a - D.w.a0), b = X(sp.b - D.w.a0);
    return `<rect x="${a.toFixed(1)}" y="${y0}" width="${Math.max(0, b - a).toFixed(1)}" height="${y1 - y0}" fill="${SEG_COL[sp.n]}" opacity=".055"/>
      <line x1="${a.toFixed(1)}" y1="${y0}" x2="${a.toFixed(1)}" y2="${y1}" stroke="${SEG_COL[sp.n]}" stroke-width=".8" opacity=".45"/>
      ${lab ? txt((a + b) / 2, y0 + 10, String(SEG_LABEL[sp.n]).split(/[ /]/)[0].toLowerCase(), { anchor: "middle", fill: SEG_COL[sp.n], size: 9, weight: 600 }) : ""}`;
  }).join("");
}
// the grip mix as a stacked strip -- the same distribution language as the turn ledger, never one swatch
function gripStrip(D, X, y, h) {
  return D.bins.map((b, i) => {
    if (!b.mix) return "";
    const x0 = X(b.s - D.BIN / 2), x1 = X(b.s + D.BIN / 2); let yy = y;
    return GSTATE.map((k, j) => { const f = b.mix[j] || 0; if (f < 0.004) return "";
      const hh = f * h, r = `<rect x="${x0.toFixed(1)}" y="${yy.toFixed(1)}" width="${(x1 - x0 + .6).toFixed(1)}" height="${hh.toFixed(1)}" fill="${DGRIP[k].col}"/>`;
      yy += hh; return r; }).join("");
  }).join("");
}

// ===== CANDIDATE A — STACKED LANES ===================================================================
function candA(D) {
  const W = 1100, padL = 46, padR = 12, x0 = padL, x1 = W - padR;
  const X = (s) => x0 + (s / D.w.len) * (x1 - x0);
  const LANES = [["speed", 112], ["g", 100], ["pedals", 54], ["limit", 76]];
  let y = 22, lanes = {};
  for (const [k, h] of LANES) { lanes[k] = { y0: y, y1: y + h, h }; y += h + 16; }
  const H = y + 22;
  const hiv = D.bins.map((b) => quant(b.mph, .95)).filter((v) => v != null);
  const lov = D.bins.map((b) => quant(b.mph, .05)).filter((v) => v != null);
  const mphHi = (hiv.length ? Math.max(...hiv) : 100) * 1.06, mphLo = (lov.length ? Math.min(...lov) : 0) * 0.9;
  const sp = lanes.speed, Y = (v) => sp.y1 - ((v - mphLo) / (mphHi - mphLo)) * sp.h;
  const bs = D.bins.map((b) => X(b.s));
  let s = `<g>${phaseBack(D, X, 14, H - 18, true)}</g>`;
  // --- speed lane: the envelope of every pass, the median, and the highlighted lap coloured by grip
  const yv = (f) => D.bins.map((b) => { const v = f(b); return v == null ? null : Y(v); });
  s += band(bs, yv((b) => quant(b.mph, .1)), yv((b) => quant(b.mph, .9)), "#7d8b9c", ".16");
  s += line(bs, yv((b) => med(b.mph)), 'stroke="#7d8b9c" stroke-width="1.6" opacity=".8"');
  if (PICK) { const p = PICK.pts.filter((q) => q.mph != null);
    for (let i = 0; i < p.length - 1; i++) s += `<line x1="${X(p[i].s).toFixed(1)}" y1="${Y(p[i].mph).toFixed(1)}" x2="${X(p[i + 1].s).toFixed(1)}" y2="${Y(p[i + 1].mph).toFixed(1)}" stroke="${DGRIP[GSTATE[p[i].grip]].ink}" stroke-width="2.6" stroke-linecap="round"/>`; }
  s += txt(4, sp.y0 + 9, "speed", { weight: 700, fill: "var(--mut)" }) + txt(4, sp.y0 + 21, "mph") +
       txt(x0 - 4, sp.y0 + 9, Math.round(mphHi), { anchor: "end" }) + txt(x0 - 4, sp.y1, Math.round(mphLo), { anchor: "end" });
  // --- g lane: lateral as a signed area, longitudinal as a line, the class ceiling dashed
  const gl = lanes.g, gMax = 3, GY = (v) => (gl.y0 + gl.y1) / 2 - (v / gMax) * (gl.h / 2);
  s += `<line x1="${x0}" y1="${GY(0).toFixed(1)}" x2="${x1}" y2="${GY(0).toFixed(1)}" stroke="var(--line2)" stroke-width="1"/>`;
  const amc = med(D.passes.map((p) => aMaxFor(p.lap.class, med(p.pts.map((q) => q.mph)))));
  if (amc) s += `<line x1="${x0}" y1="${GY(amc).toFixed(1)}" x2="${x1}" y2="${GY(amc).toFixed(1)}" stroke="#e3b341" stroke-width="1" stroke-dasharray="4 3" opacity=".7"/>
    <line x1="${x0}" y1="${GY(-amc).toFixed(1)}" x2="${x1}" y2="${GY(-amc).toFixed(1)}" stroke="#e3b341" stroke-width="1" stroke-dasharray="4 3" opacity=".7"/>` +
    txt(x1, GY(amc) - 3, `grip ceiling ${amc.toFixed(2)} g`, { anchor: "end", fill: "#e3b341" });
  const gv = (f) => D.bins.map((b) => { const v = f(b); return v == null ? null : GY(v); });
  s += band(bs, gv((b) => quant(b.aLat, .1)), gv((b) => quant(b.aLat, .9)), "#45c8b0", ".18");
  s += line(bs, gv((b) => med(b.aLat)), 'stroke="#45c8b0" stroke-width="1.8"');
  s += line(bs, gv((b) => med(b.aLong)), 'stroke="#c98bff" stroke-width="1.4" stroke-dasharray="3 2"');
  s += txt(4, gl.y0 + 9, "g", { weight: 700, fill: "var(--mut)" }) + txt(4, gl.y0 + 21, "lat / long") +
       txt(x0 - 4, gl.y0 + 4, "+3", { anchor: "end" }) + txt(x0 - 4, GY(0) + 3, "0", { anchor: "end" }) + txt(x0 - 4, gl.y1, "-3", { anchor: "end" });
  // --- pedals lane: throttle up, brake down, medians over every pass
  const pl = lanes.pedals, PY = (v, up) => up ? pl.y1 - (v / 100) * pl.h : pl.y0 + (v / 100) * pl.h;
  s += area(bs, D.bins.map((b) => { const v = med(b.thr); return v == null ? null : PY(v, 1); }), pl.y1, PED.thr, ".55");
  s += area(bs, D.bins.map((b) => { const v = med(b.brk); return v == null ? null : PY(v, 0); }), pl.y0, PED.brk, ".55");
  s += txt(4, pl.y0 + 9, "pedals", { weight: 700, fill: "var(--mut)" }) + txt(4, pl.y0 + 21, "brk / thr");
  // --- limit lane: the grip mix strip, and how much of the ceiling is being used
  const ll = lanes.limit, LY = (v) => ll.y1 - Math.min(1.1, v / 110) * (ll.h - 16);
  s += gripStrip(D, X, ll.y0, 12);
  s += `<line x1="${x0}" y1="${LY(100).toFixed(1)}" x2="${x1}" y2="${LY(100).toFixed(1)}" stroke="#e3b341" stroke-width="1" stroke-dasharray="4 3" opacity=".7"/>`;
  const uv = D.bins.map((b) => { const v = med(b.util); return v == null ? null : LY(v); });
  s += area(bs, uv, ll.y1, "#e3b341", ".2") + line(bs, uv, 'stroke="#e3b341" stroke-width="1.8"');
  s += txt(4, ll.y0 + 9, "grip", { weight: 700, fill: "var(--mut)" }) + txt(4, ll.y0 + 21, "mix + use") + txt(x1, LY(100) - 3, "100% of the ceiling", { anchor: "end", fill: "#e3b341" });
  // x axis
  for (let m = 0; m <= D.w.len; m += 25) s += `<line x1="${X(m).toFixed(1)}" y1="${H - 20}" x2="${X(m).toFixed(1)}" y2="${H - 16}" stroke="var(--line2)"/>` + txt(X(m), H - 6, m + "", { anchor: "middle" });
  s += txt(x1, H - 6, "metres through the turn", { anchor: "end" });
  return `<svg class="scope" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}

// ===== CANDIDATE B — THE GRIP BUDGET =================================================================
function candB(D) {
  const W = 1100, H = 300, padL = 46, padR = 14, x0 = padL, x1 = W - padR, y0 = 24, y1 = H - 46;
  const X = (s) => x0 + (s / D.w.len) * (x1 - x0);
  const gMax = 3.2, Y = (v) => y1 - (v / gMax) * (y1 - y0);
  const bs = D.bins.map((b) => X(b.s));
  let s = `<g>${phaseBack(D, X, y0 - 10, y1, true)}</g>`;
  // the ceiling, per bin, from each pass's own class and speed -- it moves with the speed band
  const yv = (f) => D.bins.map((b) => { const v = f(b); return v == null ? null : Y(v); });
  const ceilY = yv((b) => b.ceil);
  s += area(bs, ceilY, y1, "#e3b341", ".05") + line(bs, ceilY, 'stroke="#e3b341" stroke-width="1.4" stroke-dasharray="5 3"');
  // used g -- the band is every pass's 15th-to-90th percentile, the solid line the median. The gap up to the
  // dashed ceiling IS the grip still on the table; where the two touch, the corner is already limit-bound.
  s += band(bs, yv((b) => quant(b.aTot, .15)), yv((b) => quant(b.aTot, .9)), "#45c8b0", ".14");
  const totY = yv((b) => med(b.aTot));
  s += area(bs, totY, y1, "#45c8b0", ".16") + line(bs, totY, 'stroke="#45c8b0" stroke-width="2.2"');
  s += line(bs, yv((b) => { const v = med(b.aLat); return v == null ? null : Math.abs(v); }), 'stroke="#45c8b0" stroke-width="1" opacity=".55" stroke-dasharray="2 2"');
  // the MEASURED per-phase peak lat g -- the derivation has to answer to this
  s += D.anchors.map((a) => `<g><line x1="${(X(a.s) - 5).toFixed(1)}" y1="${Y(a.g).toFixed(1)}" x2="${(X(a.s) + 5).toFixed(1)}" y2="${Y(a.g).toFixed(1)}" stroke="#dfe7ef" stroke-width="1.6"/>
    <line x1="${X(a.s).toFixed(1)}" y1="${(Y(a.g) - 5).toFixed(1)}" x2="${X(a.s).toFixed(1)}" y2="${(Y(a.g) + 5).toFixed(1)}" stroke="#dfe7ef" stroke-width="1.6"/>
    <title>${esc(SEG_LABEL[a.n])} — measured peak ${a.g.toFixed(2)} g, median over ${a.n_obs} passes (lap_point.lat_g, schema 7)</title></g>`).join("");
  // speed as a ghost on its own scale, so the g curve keeps its meaning
  const mphHi = (Math.max(...D.bins.map((b) => med(b.mph) || 0)) || 100) * 1.05;
  s += line(bs, D.bins.map((b) => { const v = med(b.mph); return v == null ? null : y1 - (v / mphHi) * (y1 - y0) * .92; }), 'stroke="#7d8b9c" stroke-width="1.2" opacity=".5"');
  s += txt(x1, y0 + 2, `speed ghost · 0–${Math.round(mphHi)} mph`, { anchor: "end", fill: "#7d8b9c" });
  // pedals as a thin ribbon on the floor, grip mix under it
  s += gripStrip(D, X, y1 + 4, 9);
  s += D.bins.map((b, i) => { if (!b.n) return ""; const t = med(b.thr) || 0, br = med(b.brk) || 0, x = X(b.s - D.BIN / 2), w = X(b.s + D.BIN / 2) - x + .6;
    return `<rect x="${x.toFixed(1)}" y="${y1 + 15}" width="${w.toFixed(1)}" height="${(t / 100 * 7).toFixed(1)}" fill="${PED.thr}"/>` +
           `<rect x="${x.toFixed(1)}" y="${y1 + 15}" width="${w.toFixed(1)}" height="${(br / 100 * 7).toFixed(1)}" fill="${PED.brk}" opacity=".85"/>`; }).join("");
  for (let g = 0; g <= 3; g++) s += `<line x1="${x0}" y1="${Y(g).toFixed(1)}" x2="${x1}" y2="${Y(g).toFixed(1)}" stroke="var(--line)" stroke-width=".7"/>` + txt(x0 - 4, Y(g) + 3, g + " g", { anchor: "end" });
  for (let m = 0; m <= D.w.len; m += 25) s += txt(X(m), H - 6, m + "", { anchor: "middle" });
  return `<svg class="scope" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}

// ===== CANDIDATE C — THE TRACTION CIRCLE =============================================================
function candC(D) {
  const S = 300, c = S / 2, gMax = 3.2, R = (c - 26) / gMax;
  let s = "";
  const amc = med(D.passes.map((p) => aMaxFor(p.lap.class, med(p.pts.map((q) => q.mph)))));
  for (let g = 1; g <= 3; g++) s += `<circle cx="${c}" cy="${c}" r="${(g * R).toFixed(1)}" fill="none" stroke="var(--line)" stroke-width=".8"/>` + txt(c + 5, c - g * R + 11, g + " g");
  if (amc) s += `<circle cx="${c}" cy="${c}" r="${(amc * R).toFixed(1)}" fill="none" stroke="#e3b341" stroke-width="1.3" stroke-dasharray="4 3"/>`;
  s += `<line x1="${c - R * gMax}" y1="${c}" x2="${c + R * gMax}" y2="${c}" stroke="var(--line2)"/><line x1="${c}" y1="${c - R * gMax}" x2="${c}" y2="${c + R * gMax}" stroke="var(--line2)"/>`;
  s += txt(c, 12, "braking", { anchor: "middle" }) + txt(c, S - 3, "accelerating", { anchor: "middle" }) +
       txt(4, c - 4, "left") + txt(S - 4, c - 4, "right", { anchor: "end" });
  const src = PICK ? [PICK] : D.passes;
  for (const p of src) for (const q of p.pts) {
    if (q.aLat == null || q.aLong == null) continue;
    const ph = D.w.phases.find((sp) => q.arc >= sp.a && q.arc <= sp.b);
    const x = c + q.aLat * R, y = c - (-q.aLong) * R;   // braking (negative long g) plots upward
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${PICK ? 3.2 : 1.9}" fill="${ph ? SEG_COL[ph.n] : "#8a95a5"}" opacity="${PICK ? .95 : .3}"/>`;
  }
  if (PICK) {
    const pp = PICK.pts.filter((q) => q.aLat != null && q.aLong != null);
    s += `<polyline points="${P(pp.map((q) => [c + q.aLat * R, c + q.aLong * R]))}" fill="none" stroke="#dfe7ef" stroke-width=".9" opacity=".45"/>`;
  }
  return `<svg class="scope" viewBox="0 0 ${S} ${S}" style="max-width:${S}px;margin:0 auto">${s}</svg>`;
}

// ===== CANDIDATE D — ONE AXIS, EVERYTHING NORMALISED =================================================
function candD(D) {
  const W = 1100, H = 250, padL = 40, padR = 14, x0 = padL, x1 = W - padR, y0 = 20, y1 = H - 40;
  const X = (s) => x0 + (s / D.w.len) * (x1 - x0), Y = (f) => y1 - f * (y1 - y0);
  const bs = D.bins.map((b) => X(b.s));
  const mphHi = Math.max(...D.bins.map((b) => med(b.mph) || 0)) || 100;
  let s = `<g>${phaseBack(D, X, y0 - 8, y1, true)}</g>`;
  for (let f = 0; f <= 1; f += .25) s += `<line x1="${x0}" y1="${Y(f).toFixed(1)}" x2="${x1}" y2="${Y(f).toFixed(1)}" stroke="var(--line)" stroke-width=".6"/>` + txt(x0 - 4, Y(f) + 3, Math.round(f * 100) + "%", { anchor: "end" });
  const nv = (f) => D.bins.map((b) => { const v = f(b); return v == null ? null : Y(v); });
  const spd = nv((b) => { const v = med(b.mph); return v == null ? null : v / mphHi; });
  s += area(bs, spd, y1, "#7d8b9c", ".14") + line(bs, spd, 'stroke="#7d8b9c" stroke-width="2"');
  s += line(bs, nv((b) => { const v = med(b.util); return v == null ? null : Math.min(1.1, v / 100); }), 'stroke="#e3b341" stroke-width="2"');
  s += line(bs, nv((b) => { const v = med(b.aLat); return v == null ? null : Math.abs(v) / 3; }), 'stroke="#45c8b0" stroke-width="1.6" stroke-dasharray="4 2"');
  s += line(bs, nv((b) => { const v = med(b.thr); return v == null ? null : v / 100; }), `stroke="${PED.thr}" stroke-width="1.3"`);
  s += line(bs, nv((b) => { const v = med(b.brk); return v == null ? null : v / 100; }), `stroke="${PED.brk}" stroke-width="1.3"`);
  s += gripStrip(D, X, y1 + 4, 11);
  for (let m = 0; m <= D.w.len; m += 25) s += txt(X(m), H - 6, m + "", { anchor: "middle" });
  return `<svg class="scope" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}

const key = (items) => `<div class="key">${items.map(([c, w, ln]) => `<span><i class="${ln ? "ln" : ""}" style="background:${c}"></i>${esc(w)}</span>`).join("")}</div>`;
const GRIPKEY = GSTATE.map((k) => [DGRIP[k].col, DGRIP[k].word]);

function draw() {
  const t = C.turns.find((x) => String(x.seq) === document.getElementById("turn").value);
  TURN = t;
  const D = collect(t);
  const head = (id, n, title, cap, body, cost) => {
    document.getElementById(id).innerHTML = `<h2>${esc(title)}<small>candidate ${n}</small></h2><p class="cap">${cap}</p>${body}<div class="cost">${cost}</div>`;
  };
  if (!D) { ["cA", "cB", "cC", "cD"].forEach((i) => document.getElementById(i).innerHTML = `<p class="cap">no passes through this turn in the current filter</p>`); return; }
  const nm = `T${t.seq} ${esc(t.kind || "")} · ${Math.round(t.r)} m · ${Math.round(t.deg)}°${t.dir || ""} · ${D.passes.length} passes · ${Math.round(D.w.len)} m of road`;
  document.getElementById("src").textContent = nm;

  head("cA", "A", "Stacked lanes", `<b>The motorsport trace.</b> One shared distance axis, one lane per question: how fast, how hard, what the feet did, and how much of the grip that used. Every lane shows the <b>envelope of every pass</b> (the pale band) with the median through it, so one bad lap can never be the picture; the highlighted lap rides on top of the speed lane, coloured by its grip state moment to moment. The dashed amber lines are the class's own grip ceiling.`,
    candA(D),
    `<b>Reads well for:</b> where in the corner it goes wrong, and whether the driver or the car did it. <b>Costs:</b> the tallest of the four (~360 px) and four y-scales to learn. <b>Needs:</b> nothing new — except real g (see the note at the top).`);

  head("cB", "B", "The grip budget", `<b>One question: how much of the tyre is left.</b> The y-axis is g. The dashed amber line is what this class can actually pull at this speed (<code>classGrip</code>, speed-banded); the filled curve is what the car <b>did</b> pull, combined lateral and longitudinal. <b>The gap between them is the lap time still on the table.</b> The white crosses are the measured per-phase peak lat g that the export already carries — the derived curve has to answer to them. Speed rides as a grey ghost, the pedals and the grip mix as strips on the floor.`,
    candB(D),
    `<b>Reads well for:</b> "is this understeer at the limit, or am I just slow here?" — the thing the ledger's price cannot say. <b>Costs:</b> everything is in g, so speed loses its scale. <b>Needs:</b> the measured <code>lat_g</code> exported to stop deriving it.`);

  head("cC", "C", "The traction circle", `<b>The car's grip envelope, not the road's.</b> Each dot is one sample: lateral g across, longitudinal g up (braking) and down (power), coloured by the phase it happened in. The dashed ring is the class ceiling. A circle that is <b>filled out</b> is a car being used; a cross or an L shape is a driver braking and turning in separate steps. Pick a lap to draw only that pass, joined in order.`,
    `<div class="two">${candC(D)}<div><p class="cap" style="margin:0">${D.passes.length} pass${D.passes.length === 1 ? "" : "es"} plotted${PICK ? ", one lap highlighted" : ""}. The phases keep their colours from every other surface, so a yellow cluster low and left means the mid-corner is being taken on the power, turning left.</p>${key(SEG_ORDER.map((n) => [SEG_COL[n], SEG_LABEL[n]]))}</div></div>`,
    `<b>Reads well for:</b> the car's balance and the driver's technique in one glance — and it is the only one of the four that separates "at the limit" from "at the limit in the wrong direction". <b>Costs:</b> no distance axis at all, so it says nothing about <em>where</em>. Best as a companion to A or B, not a replacement.`);

  head("cD", "D", "One axis, everything normalised", `<b>The literal reading of "one graph".</b> Every channel rescaled to 0–100% of its own range and drawn on one set of gridlines: speed, limit use, lateral g, throttle, brake, with the grip mix as a strip underneath. It is the most compact of the four.`,
    candD(D),
    `<b>Reads well for:</b> nothing in particular — and that is the finding worth having. Once five lines share one axis, none of them keeps a unit, "80%" means five different things, and the crossings are coincidences of scaling rather than facts. <b>Kept here as the control</b>, so the case for A or B is made against the obvious answer rather than assumed.`);

  document.getElementById("cA").insertAdjacentHTML("beforeend", key(GRIPKEY.concat([["#45c8b0", "lateral g", 1], ["#c98bff", "longitudinal g", 1], [PED.thr, "throttle"], [PED.brk, "brake"], ["#e3b341", "grip ceiling / limit use", 1]])));
}

async function boot() {
  C = await (await fetch("../api/course/route_5191.json")).json();
  REF = Object.values(C.traces).reduce((a, b) => (b.length > a.length ? b : a));
  C.laps.forEach((l) => { LAPS[String(l.id)] = l; });
  const ts = document.getElementById("turn");
  ts.innerHTML = C.turns.filter((t) => t.seg && t.phaseObs).map((t) => `<option value="${t.seq}">T${t.seq} · ${esc(t.kind || "")} · ${Math.round(t.r)} m</option>`).join("");
  ts.value = "5";
  const cs = document.getElementById("cls");
  const classes = [...new Set(C.laps.map((l) => l.class))].filter(Boolean).sort();
  cs.innerHTML = `<option value="">all</option>` + classes.map((c) => `<option>${esc(c)}</option>`).join("");
  const refresh = () => {
    const ls = document.getElementById("lap");
    const avail = C.laps.filter((l) => C.traces[String(l.id)] && (!CLS || l.class === CLS));
    ls.innerHTML = `<option value="">none — every pass</option>` + avail.map((l) => `<option value="${l.id}">${l.class} · ${l.t ? (l.t / 1000).toFixed(2) + " s" : "—"} · lap ${l.id}</option>`).join("");
  };
  const redraw = () => {
    CLS = cs.value;
    const D0 = null; void D0;
    const lid = document.getElementById("lap").value;
    PICK = null;
    draw();
    if (lid) { const D = collect(C.turns.find((x) => String(x.seq) === ts.value)); PICK = (D && D.passes.find((p) => p.id === lid)) || null; draw(); }
  };
  cs.onchange = () => { CLS = cs.value; refresh(); redraw(); };
  ts.onchange = redraw;
  document.getElementById("lap").onchange = redraw;
  refresh();
  document.getElementById("dataNote").innerHTML =
    `<b>What is real here and what is not.</b> Speed, grip state and both pedals are measured, straight out of <code>lap_point</code>. ` +
    `<span class="miss">G-force is derived in this page</span> — lateral from the curvature of the driven line and longitudinal from the change in speed — because <code>build_web.py</code> exports neither <code>lat_g</code> (already stored, schema 7) nor <code>r_m</code> (schema 9). ` +
    `Candidate B draws the measured per-phase peak lat g as white crosses so you can see how close the derivation gets, and the derived sign was checked against <code>ref_route_turn.dir</code> — it calls the hand of the turn correctly on all 17. ` +
    `The limit-use "rating" is <code>|a| / aMax</code> against the course's own <code>classGrip</code> ceiling for that class and speed band. ` +
    `Traces are sampled every 12 m, so a 160 m turn is ~14 points a lap — fine for the ${"envelope"} over 40-odd laps, coarse for a single line.`;
  redraw();
}
boot();
</script>
</body>
